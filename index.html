<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: transparent; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; max-width: 600px; height: auto; border-radius: 8px; }
    </style>
</head>
<body>
    <!-- 控制条、自动播放/循环播放均可自由配置 -->
    <video controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4">
        您的浏览器不支持 HTML5 视频。
    </video>
</body>
</html>
